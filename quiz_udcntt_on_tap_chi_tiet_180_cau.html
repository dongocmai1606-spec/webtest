<style>
:root{
 --blue:#1d4ed8;--blue2:#2563eb;--green:#15803d;--red:#b91c1c;
 --orange:#c2410c;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);line-height:1.5}
header{background:linear-gradient(135deg,#173b8f,#2563eb);color:#fff;padding:28px 16px;text-align:center;position:sticky;top:0;z-index:20;box-shadow:0 3px 14px #0003}
header h1{margin:0 0 6px;font-size:28px}
header p{margin:0;opacity:.95}
.wrap{max-width:1100px;margin:auto;padding:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.toolbar button,.actions button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.toolbar button{background:#fff;color:var(--blue);box-shadow:0 2px 8px #0001}
.progressbox{background:#fff;padding:15px 16px;border-radius:14px;box-shadow:0 2px 9px #0001;margin-bottom:18px}
.bar{height:11px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;width:0;background:#22c55e;transition:.2s}
.section-title{margin:28px 0 12px;padding:12px 16px;background:#e8efff;border-left:6px solid var(--blue);border-radius:10px;color:#12347d}
.card{background:var(--card);border-radius:14px;padding:18px;margin:13px 0;box-shadow:0 2px 10px #00000010;border-left:4px solid #93b4ff}
.q{font-weight:700;font-size:16px;margin-bottom:12px}
.option{display:block;border:1px solid #d8e0ec;border-radius:9px;padding:10px 12px;margin:7px 0;cursor:pointer;background:#fff}
.option:hover{background:#eef5ff;border-color:#8eb4ff}
.option input{margin-right:8px}
.qimg{display:block;max-width:100%;max-height:210px;margin:10px auto 14px;border:1px solid #dbe2ea;border-radius:8px;padding:5px;background:#fff}
.explain{display:none;margin-top:10px;padding:11px 13px;background:#f7f9fc;border-radius:9px;font-size:14px}
.correct{background:#eaf8ef!important;border-color:#61b77b!important}
.wrong{background:#fff0f0!important;border-color:#df7777!important}
.result{display:none;background:#fff;border-radius:16px;padding:22px;margin:22px 0;box-shadow:0 3px 14px #0002}
.score{font-size:38px;font-weight:800;color:#173b8f}
.actions{text-align:center;padding:25px 0 45px}
#submit{background:#2563eb;color:#fff}
#reset{background:#64748b;color:#fff;margin-left:8px}
.note{font-size:13px;color:var(--muted)}
.jump{font-size:13px}
.badge{display:inline-block;background:#eef4ff;color:#174ea6;border-radius:999px;padding:3px 8px;font-size:12px;margin-right:6px}
@media(max-width:700px){header h1{font-size:21px}.wrap{padding:10px}.card{padding:14px}}
</style>
</head>

const letters = ["A","B","C","D"];
const quiz = document.getElementById("quiz");
const result = document.getElementById("result");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function render(){
 let lastSection="";
 let html="";
 questions.forEach((item,i)=>{
   if(item.section!==lastSection){
     html += `<h2 class="section-title" id="${CSS.escape(item.section)}">${item.section}</h2>`;
     lastSection=item.section;
   }
   html += `<section class="card" id="qcard${i}">
     <div class="q"><span class="badge">Câu ${i+1}</span>${escapeHtml(item.q)}</div>
     ${item.img ? `<img class="qimg" src="${item.img}" alt="Hình minh họa câu ${i+1}">` : ""}
     ${item.opts.map((o,j)=>`
       <label class="option" data-q="${i}" data-a="${j}">
         <input type="radio" name="q${i}" value="${j}">
         <b>${letters[j]}.</b> ${escapeHtml(o)}
       </label>`).join("")}
     <div class="explain" id="exp${i}"></div>
   </section>`;
 });
 quiz.innerHTML=html;
 document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',updateProgress));
}
function escapeHtml(s){
 const d=document.createElement("div"); d.textContent=s; return d.innerHTML;
}
function updateProgress(){
 let n=0;
 questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});
 progressText.textContent=`${n}/${questions.length}`;
 progressBar.style.width=`${n/questions.length*100}%`;
}
function grade(){
 let score=0, unanswered=0;
 questions.forEach((item,i)=>{
   const selected=document.querySelector(`input[name=q${i}]:checked`);
   if(!selected) unanswered++;
   const labels=document.querySelectorAll(`[data-q="${i}"]`);
   labels.forEach((lab,j)=>{
     lab.classList.remove("correct","wrong");
     if(j===item.ans) lab.classList.add("correct");
     if(selected && Number(selected.value)===j && j!==item.ans) lab.classList.add("wrong");
   });
   const exp=document.getElementById("exp"+i);
   exp.style.display="block";
   exp.innerHTML=`<b>Đáp án đúng: ${letters[item.ans]}. ${escapeHtml(item.opts[item.ans])}</b><br>${escapeHtml(item.exp)}`;
   if(selected && Number(selected.value)===item.ans) score++;
 });
 const pct=Math.round(score/questions.length*100);
 let msg=pct>=90?"🏆 Xuất sắc – mức độ nắm kiến thức rất tốt!":
         pct>=80?"🎉 Rất tốt – chỉ cần rà lại các câu sai.":
         pct>=65?"👍 Khá – nên ôn lại các nhóm còn yếu.":
         "📚 Cần ôn tập thêm – ưu tiên các phím tắt, hàm Excel và hiệu ứng PowerPoint.";
 result.style.display="block";
 result.innerHTML=`<div class="score">${score}/${questions.length}</div>
 <p><b>${pct}%</b> — ${msg}</p>
 <p>Câu chưa trả lời: <b>${unanswered}</b>. Sau khi chấm, đáp án đúng được tô xanh và lựa chọn sai (nếu có) tô đỏ.</p>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function scrollToSection(id){
 const el=document.getElementById(id);
 if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("submit").addEventListener("click",grade);
document.getElementById("reset").addEventListener("click",()=>location.reload());
render();
</script>
